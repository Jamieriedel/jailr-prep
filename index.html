<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAILR Prep – Cue & Energy Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311100F'/%3E%3Cpath d='M8 22V10M13 22V14M18 22V8M23 22V16' stroke='%23F4F0E8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#11100F;--bg2:#171614;--bg3:#1E1C1A;--bg4:#262320;--line:#2B2825;--line2:#3B3732;
  --fg:#F4F0E8;--fg2:#BDB6AA;--fg3:#7F786E;
  --cA:#28E214;--cF:#FF9A1F;--cG:#F0443A;--cL:#3D9BFF;
  --ok:#4CD07D;--warn:#FFB224;--err:#F0443A;
  --r:10px;
  font-family:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
body{display:grid;height:100vh;overflow:hidden;
  grid-template-columns:var(--side,240px) 1fr;
  grid-template-rows:56px auto 1fr auto;
  grid-template-areas:"top top" "side bar" "side main" "side detail"}
body.noside{--side:0px}
/* top */
header{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:14px;white-space:nowrap}
.logo small{font-weight:500;letter-spacing:.08em;color:var(--fg3);font-size:11px}
.logo .mark{width:26px;height:26px;border-radius:7px;background:var(--fg);display:grid;place-items:center}
.pills{display:flex;gap:6px;margin-left:8px;min-width:0;overflow:hidden}
.pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);color:var(--fg2);font-size:12px;white-space:nowrap;cursor:pointer}
.pill:hover{border-color:var(--line2);color:var(--fg)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.pill.ok .dot{background:var(--ok)}.pill.warn .dot{background:var(--warn)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg3);cursor:pointer;white-space:nowrap;font-weight:500;transition:background .12s,border-color .12s}
.btn:hover{background:var(--bg4);border-color:#4a453f}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg3)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn kbd{font-size:10px;opacity:.6}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
kbd{font-family:inherit;font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid var(--line2);background:var(--bg3);color:var(--fg2)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:38px;min-width:250px;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:6px;z-index:40;box-shadow:0 12px 40px rgba(0,0,0,.5);display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;gap:10px;align-items:flex-start;text-align:left;padding:8px 10px;border:0;background:none;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--bg4)}
.menu button small{display:block;color:var(--fg3);font-size:11px;margin-top:2px}
/* sidebar */
aside{grid-area:side;border-right:1px solid var(--line);overflow:auto;padding:10px 8px;background:var(--bg)}
body.noside aside{display:none}
.side-h{font-size:10px;letter-spacing:.14em;color:var(--fg3);padding:8px 8px 6px;text-transform:uppercase}
.pl{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--fg2);user-select:none}
.pl:hover{background:var(--bg3);color:var(--fg)}
.pl.active{background:var(--bg4);color:var(--fg)}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .ct{font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.pl .prog{width:22px;height:3px;border-radius:2px;background:var(--line2);overflow:hidden;flex:none}
.pl .prog i{display:block;height:100%;background:var(--ok)}
.pl.folder{color:var(--fg3);font-size:12px}
.pl .chev{width:12px;transition:transform .15s}
.pl.collapsed .chev{transform:rotate(-90deg)}
/* toolbar */
.bar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);min-width:200px;flex:0 1 260px}
.search input{border:0;background:none;outline:none;width:100%}
.search:focus-within{border-color:var(--fg3)}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--fg2);font-size:12px}
.seg button.on{background:var(--bg4);color:var(--fg)}
.seg button .n{color:var(--fg3);margin-left:4px;font-variant-numeric:tabular-nums}
.sorts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sorts .lbl{color:var(--fg3);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 4px 0 9px;border-radius:7px;background:var(--bg3);border:1px solid var(--line2);cursor:grab;font-size:12px;user-select:none}
.chip .lv{font-size:10px;color:var(--fg3)}
.chip .dir{border:0;background:none;cursor:pointer;padding:2px 4px;border-radius:4px;color:var(--fg)}
.chip .dir:hover,.chip .x:hover{background:var(--bg4)}
.chip .x{border:0;background:none;cursor:pointer;color:var(--fg3);padding:2px 5px;border-radius:4px}
.chip.drag{opacity:.4}
.chip.over{border-color:var(--fg)}
select.add{height:28px;border-radius:7px;background:var(--bg2);border:1px dashed var(--line2);padding:0 6px;color:var(--fg2);font-size:12px;cursor:pointer}
/* main table */
main{grid-area:main;overflow:auto;position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--bg);z-index:2;text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--fg)}
thead th .si{font-size:10px;color:var(--fg);margin-left:3px}
tbody td{padding:7px 8px;border-bottom:1px solid #1c1a18;white-space:nowrap;vertical-align:middle}
tbody tr{cursor:default}
tbody tr:hover td{background:#191816}
tbody tr.sel td{background:#24211d}
tbody tr.focus td{box-shadow:inset 0 1px 0 var(--line2),inset 0 -1px 0 var(--line2)}
tbody tr.focus td:first-child{box-shadow:inset 2px 0 0 var(--fg),inset 0 1px 0 var(--line2),inset 0 -1px 0 var(--line2)}
td.num{color:var(--fg3);width:36px;text-align:right}
td.tt{max-width:340px;min-width:180px}
td.tt .ti{font-weight:600;overflow:hidden;text-overflow:ellipsis}
td.tt .ar{color:var(--fg3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
td.r{text-align:right}
.kc{display:inline-block;min-width:34px;text-align:center;padding:2px 6px;border-radius:5px;font-weight:600;font-size:12px;background:hsl(var(--h) 55% 22%);color:hsl(var(--h) 85% 78%)}
.kn{color:var(--fg3);font-size:11px;margin-left:5px}
.meter{display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:middle}
.meter i{width:4px;border-radius:1px;background:var(--line2)}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:7px}.meter i:nth-child(3){height:9px}.meter i:nth-child(4){height:11px}.meter i:nth-child(5){height:14px}
.meter[data-s="1"] i:nth-child(-n+1){background:#5B8CFF}
.meter[data-s="2"] i:nth-child(-n+2){background:#45C2D8}
.meter[data-s="3"] i:nth-child(-n+3){background:#7BD65A}
.meter[data-s="4"] i:nth-child(-n+4){background:#FFB224}
.meter[data-s="5"] i:nth-child(-n+5){background:#F0443A}
.esc{color:var(--fg3);font-size:11px;margin-left:6px}
.gn,.kb{font-size:12px;color:var(--fg3)}.gn.mid,.kb.mid{color:var(--warn)}.gn.bad,.kb.bad{color:var(--err);font-weight:600}
.cues{display:inline-flex;gap:3px}
.cb{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;font-size:10px;font-weight:700;background:var(--bg3);color:var(--fg3);border:1px solid var(--line)}
.cb.on{color:#111;border-color:transparent}
.cb.A.on{background:var(--cA)}.cb.F.on{background:var(--cF)}.cb.G.on{background:var(--cG)}.cb.L.on{background:var(--cL)}
.cb.kept{background:transparent;border:1px solid var(--fg3);color:var(--fg2)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--fg3)}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.err{color:var(--err)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--fg);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
svg.spark{display:block}
/* empty */
.empty{max-width:720px;margin:7vh auto;padding:0 24px}
.empty h1{font-size:28px;letter-spacing:-.01em;margin:0 0 6px}
.empty p{color:var(--fg2);line-height:1.55;margin:0 0 22px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.step{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px}
.step b{display:block;font-size:11px;letter-spacing:.12em;color:var(--fg3);margin-bottom:8px}
.step h3{margin:0 0 6px;font-size:15px}
.step p{font-size:12px;margin:0 0 12px;color:var(--fg2)}
.step.done{border-color:#2f5a3e}
.step.done b{color:var(--ok)}
.drop{position:fixed;inset:0;background:rgba(17,16,15,.86);border:2px dashed var(--fg);display:none;place-items:center;z-index:60;font-size:20px;font-weight:600}
.drop.on{display:grid}
/* detail */
.detail{grid-area:detail;border-top:1px solid var(--line);background:var(--bg2);min-height:0}
.detail.hidden{display:none}
.dh{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;flex-wrap:wrap}
.dh .tn{font-weight:700;font-size:15px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .ta{color:var(--fg3)}
.facts{display:flex;gap:14px;color:var(--fg2);font-size:12px;margin-left:6px}
.facts b{color:var(--fg);font-weight:600}
.jumps{display:flex;gap:6px}
.jb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--line2);background:var(--bg3);cursor:pointer;font-size:12px}
.jb:hover{background:var(--bg4)}
.jb i{width:8px;height:8px;border-radius:2px;display:block}
.jb .t{color:var(--fg3);font-variant-numeric:tabular-nums}
.tl-wrap{padding:4px 14px 6px;position:relative}
canvas#tl{width:100%;height:132px;display:block;border-radius:8px;background:var(--bg);cursor:crosshair}
.tl-tip{position:absolute;top:0;pointer-events:none;background:var(--bg4);border:1px solid var(--line2);padding:2px 6px;border-radius:5px;font-size:11px;display:none;white-space:nowrap}
.dfoot{display:flex;gap:14px;padding:0 14px 10px;color:var(--fg3);font-size:12px;flex-wrap:wrap}
.flag{color:var(--warn)}
/* progress */
.progress{display:none;align-items:center;gap:10px;font-size:12px;color:var(--fg2)}
.progress.on{display:flex}
.pbar{width:140px;height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--fg);width:0;transition:width .2s}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50;padding:20px}
.modal-bg.on{display:grid}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;width:min(620px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{margin:0;font-size:17px;padding:18px 20px 4px}
.modal .sub{color:var(--fg3);padding:0 20px 10px;margin:0;font-size:12px}
.modal .body{padding:8px 20px 16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.field{display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:600}
.field small{display:block;color:var(--fg3);font-weight:400;margin-top:2px;line-height:1.4}
.field select,.field input[type=number]{height:32px;border-radius:7px;background:var(--bg3);border:1px solid var(--line2);padding:0 8px;width:100%}
.switch{justify-self:end;position:relative;width:38px;height:22px}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line2);cursor:pointer;transition:.15s}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:var(--fg);transition:.15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(16px)}
ol.guide{padding-left:20px;line-height:1.6;color:var(--fg2)}
ol.guide b{color:var(--fg)}
.note{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--fg2);font-size:12px;line-height:1.5;margin:10px 0}
.note.warn{border-color:#5a4520}
.plsel{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:4px}
.plsel label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.plsel label:hover{background:var(--bg3)}
.plsel .c{margin-left:auto;color:var(--fg3);font-size:11px}
/* toast */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--bg4);border:1px solid var(--line2);padding:10px 14px;border-radius:9px;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:ti .2s ease-out}
.toast.err{border-color:#6b2a25}
@keyframes ti{from{transform:translateY(8px);opacity:0}}
.hidden-input{display:none}
@media (max-width:900px){
  body{--side:0px}
  aside{display:none}
  body.showside{--side:220px}
  body.showside aside{display:block}
  td.sp,th.sp,td.lu,th.lu,td.du,th.du{display:none}
  .steps{grid-template-columns:1fr}
  .facts{display:none}
}
</style>
</head>
<body>
<header>
  <button class="btn ghost icon" id="btnSide" title="Playlists ein/aus"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="logo"><div class="mark"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 17V8M10 17V11M14 17V6M18 17V12" stroke="#11100F" stroke-width="2.6" stroke-linecap="round"/></svg></div>JAILR PREP <small>CUE &amp; ENERGY LAB</small></div>
  <div class="pills">
    <div class="pill" id="pillXml" title="rekordbox XML laden"><span class="dot"></span><span>Keine XML</span></div>
    <div class="pill" id="pillMusic" title="Musikordner verbinden"><span class="dot"></span><span>Kein Musikordner</span></div>
  </div>
  <div class="spacer"></div>
  <div class="progress" id="progress"><span id="progTxt"></span><div class="pbar"><i id="progBar"></i></div><button class="btn ghost" id="btnCancel">Stopp</button></div>
  <button class="btn primary" id="btnAnalyze" disabled title="Auswahl oder ganze Playlist analysieren (Enter)"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h3l3-8 4 16 3-8h5"/></svg><span id="btnAnalyzeTxt">Analysieren</span></button>
  <div class="menu-wrap">
    <button class="btn" id="btnExport" disabled><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Export</button>
    <div class="menu" id="exportMenu">
      <button data-act="xml"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/></svg><div>rekordbox XML<small>Cues, Rating &amp; Energie-Kommentar zurück in die Collection</small></div></button>
      <button data-act="serato"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/></svg><div>Serato Crates<small>Playlists als _Serato_-Ordner (ZIP)</small></div></button>
    </div>
  </div>
  <button class="btn ghost icon" id="btnSettings" title="Einstellungen"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="btn ghost icon" id="btnHelp" title="Anleitung & Shortcuts (?)"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg></button>
</header>

<aside id="side"></aside>

<div class="bar" id="bar">
  <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Suchen…  ( / )" autocomplete="off"></label>
  <div class="seg" id="filt"></div>
  <div class="sorts" id="sorts"></div>
</div>

<main id="main"></main>

<section class="detail hidden" id="detail">
  <div class="dh">
    <button class="btn icon" id="btnPlay" title="Abspielen / Stopp (Leertaste)"><svg class="i" viewBox="0 0 24 24" id="playIco"><path d="M7 5l12 7-12 7z"/></svg></button>
    <div style="min-width:0"><div class="tn" id="dTitle"></div><div class="ta" id="dArtist"></div></div>
    <div class="facts" id="dFacts"></div>
    <div class="spacer"></div>
    <div class="jumps" id="dJumps"></div>
    <button class="btn ghost" id="btnReset" title="Manuelle Änderungen verwerfen (R)">Auto</button>
    <button class="btn ghost" id="btnReanalyze" title="Track neu analysieren">Neu analysieren</button>
  </div>
  <div class="tl-wrap"><canvas id="tl"></canvas><div class="tl-tip" id="tlTip"></div></div>
  <div class="dfoot" id="dFoot"></div>
</section>

<div class="drop" id="drop">XML oder Musikordner hier ablegen</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="inXml" class="hidden-input" accept=".xml,text/xml">
<input type="file" id="inDir" class="hidden-input" webkitdirectory directory multiple>

<script>
'use strict';
/* ============ utils ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

    const k=f.name.normalize('NFC').toLowerCase();
    if(!state.files.has(k))state.files.set(k,[]);
    const arr=state.files.get(k);

function matchFiles(){
  for(const t of state.tracks.values()){
    const c=state.files.get(t.fname.toLowerCase());

    if(c.length===1){t.file=c[0].f;continue}
    const tp=t.path.toLowerCase();let best=null,bs=-1;
    for(const x of c){const rp=x.rp.toLowerCase();let i=0;while(i<rp.length&&i<tp.length&&rp[rp.length-1-i]===tp[tp.length-1-i])i++;const sc=i+(t.size&&x.f.size===t.size?1000:0);if(sc>bs){bs=sc;best=x.f}}

    c.fillStyle=`rgba(244,240,232,${0.18+0.5*midN})`;const y=yv(a.rms[b]);c.fillRect(x0,y,Math.max(1,x1-x0-0.6),H0+HH-y);
    const yl=yv(a.low[b]+ (pct(a.rms,0.8)-pct(a.low,0.8)));c.fillStyle='rgba(61,155,255,.75)';c.fillRect(x0,yl,Math.max(1,x1-x0-0.6),1.5)}
  // markers
  const mk=(k,tm,col,lab)=>{const X=x(tm);c.fillStyle=col;c.fillRect(X-1,0,2,h);c.beginPath();c.moveTo(X-1,0);c.lineTo(X+15,0);c.lineTo(X+15,14);c.lineTo(X-1,14);c.fill();c.fillStyle='#111';c.font='bold 10px "Space Grotesk",sans-serif';c.fillText(lab,X+3,10.5)};
  mk('L',ct.L0,CUE.L.col,'L');mk('A',ct.A,CUE.A.col,'A');mk('F',ct.F,CUE.F.col,'F');mk('G',ct.G,CUE.G.col,'G');
  if(TL.hover>=0){c.fillStyle='rgba(244,240,232,.35)';c.fillRect(x(barT(a,TL.hover)),H0,1,HH)}
  if(PB.id===t.id&&PB.src){const X=x(PB.pos());c.fillStyle='#fff';c.fillRect(X-0.5,0,1.5,h)}
}
function nearestBar(a,s){let best=0,bd=1e9;for(let b=0;b<a.db.length;b++){const d=Math.abs(a.db[b]-s);if(d<bd){bd=d;best=b}}return best}

const PB={src:null,id:null,buf:new Map(),t0:0,off:0,loop:null,raf:0,
  pos(){if(!this.src)return 0;const el=getCtx().currentTime-this.t0+this.off;if(this.loop){const[ls,le]=this.loop;if(el>le)return ls+((el-ls)%(le-ls))}return el}};

async function play(at,loop){
  const t=state.tracks.get(state.focus);if(!t||!t.file){toast('Keine Audiodatei verbunden',1);return}
  stop();const ctx=getCtx();if(ctx.state==='suspended')await ctx.resume();
  let buf;try{buf=await getPreview(t)}catch(e){toast(e.message,1);return}
  const s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);
  if(loop){s.loop=true;s.loopStart=loop[0];s.loopEnd=loop[1]}
  s.start(0,Math.max(0,at));PB.src=s;PB.id=t.id;PB.t0=ctx.currentTime;PB.off=Math.max(0,at);PB.loop=loop||null;
  s.onended=()=>{if(PB.src===s)stop()};
  $('#playIco').innerHTML='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  const tick=()=>{drawTL();PB.raf=requestAnimationFrame(tick)};tick();
}
function jump(k){const t=state.tracks.get(state.focus);if(!t||!t.analysis)return;const ct=cueTimes(t);if(k==='L')play(ct.L0,[ct.L0,ct.L1]);else play(ct[k])}

/* ============ batch analysis ============ */
async function analyzeIds(ids,force){
  const q=ids.map(id=>state.tracks.get(id)).filter(t=>t&&t.file&&(force||!t.analysis));
  const missing=ids.filter(id=>!state.tracks.get(id)?.file).length;
  if(!q.length){toast(missing?`${missing} Tracks ohne Audiodatei – Musikordner verbinden`:'Alles schon analysiert',!!missing);return}
  state.busy=true;state.cancel=false;renderTop();$('#progress').classList.add('on');
  let done=0,err=0;const t0=performance.now();
  const upd=()=>{const el=(performance.now()-t0)/1000,eta=done?el/done*(q.length-done):0;$('#progTxt').textContent=`${done}/${q.length}${done?` · noch ~${fmtT(eta)}`:''}`;$('#progBar').style.width=(done/q.length*100)+'%'};upd();
  const worker=async()=>{while(q.length&&!state.cancel){const t=q.shift();t.status='busy';t.error='';updateRow(t);
    try{t.analysis=await analyzeTrack(t);t.status='done';IDB.put('analysis',ALG_V+'|'+t.loc+'|'+t.size,t.analysis)}
    catch(e){t.status='error';t.error=e.message||String(e);err++}
    done++;upd();relCache=null;updateRow(t);if(t.id===state.focus)renderDetail();await sleep(0)}};
  await Promise.all([worker(),worker()]);
  q.length=0;state.busy=false;$('#progress').classList.remove('on');
  for(const t of state.tracks.values())if(t.status==='busy')t.status=t.analysis?'done':'idle';
  renderAll();toast(state.cancel?'Analyse gestoppt':`${done-err} Tracks analysiert${err?` · ${err} Fehler`:''}${missing?` · ${missing} ohne Datei`:''}`,err>0);
}

/* ============ export: rekordbox XML ============ */
function buildXml(ids,plNameIn){
  const ser=new XMLSerializer();const out=[];let n=0;
  for(const id of ids){const t=state.tracks.get(id);if(!t||!t.analysis)continue;n++;
    const el=t.el.cloneNode(true);const ct=cueTimes(t);const doc=el.ownerDocument;
    for(const pm of [...el.querySelectorAll('POSITION_MARK')]){
      const num=+pm.getAttribute('Num'),nm=pm.getAttribute('Name')||'';
      const ours=(num===-1&&nm.startsWith(CUE.L.name))||(S.overwrite&&[0,5,6].includes(num));
      if(ours)pm.remove();
    }
    const add=(attrs)=>{const pm=doc.createElement('POSITION_MARK');for(const[k,v]of Object.entries(attrs))pm.setAttribute(k,v);el.appendChild(doc.createTextNode('\n'));el.appendChild(pm)};
    const f3=x=>x.toFixed(3);
    for(const k of['A','F','G'])if(slotState(t,k)==='set'){const C=CUE[k];add({Name:C.name,Type:'0',Start:f3(ct[k]),Num:String(C.num),Red:C.rgb[0],Green:C.rgb[1],Blue:C.rgb[2]})}
    add({Name:`${CUE.L.name} ${S.loopBars} Bars`,Type:'4',Start:f3(ct.L0),End:f3(ct.L1),Num:'-1'});
    const st=stars(t);
    if(S.writeRating)el.setAttribute('Rating',String(RATING_VAL[st]));
    if(S.writeComment){const g=gainOf(t);const tag=`[E${st} ${t.analysis.score} | ${t.analysis.lufs.toFixed(1)} LUFS${g!=null&&Math.abs(g)>=1.5?` | Gain ${g>0?'+':''}${g.toFixed(1)}`:''}]`;const old=(el.getAttribute('Comments')||'').replace(/\s*\[E\d[^\]]*\]\s*/g,' ').trim();el.setAttribute('Comments',(old?old+' ':'')+tag)}
    out.push('    '+ser.serializeToString(el).replace(/ xmlns="[^"]*"/,''));
  }
  const ver=state.doc.querySelector('PRODUCT')?.getAttribute('Version')||'7.0.0';
  const plName=plNameIn||((state.cur>=0?state.playlists[state.cur].name:'Collection')+' Edited');
  const ordered=ids.filter(id=>state.tracks.get(id)?.analysis);
  const xa=s=>s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const xml=`<?xml version="1.0" encoding="UTF-8"?>\n<DJ_PLAYLISTS Version="1.0.0">\n  <PRODUCT Name="rekordbox" Version="${xa(ver)}" Company="AlphaTheta"/>\n  <COLLECTION Entries="${n}">\n${out.join('\n')}\n  </COLLECTION>\n  <PLAYLISTS>\n    <NODE Type="0" Name="ROOT" Count="1">\n      <NODE Name="JAILR Prep" Type="0" Count="1">\n        <NODE Name="${xa(plName)}" Type="1" KeyType="0" Entries="${ordered.length}">\n${ordered.map(id=>`          <TRACK Key="${xa(id)}"/>`).join('\n')}\n        </NODE>\n      </NODE>\n    </NODE>\n  </PLAYLISTS>\n</DJ_PLAYLISTS>\n`;
  return{xml,n,plName};
}
function exportXml(){
  const scope=$('input[name=xscope]:checked')?.value||'view';
  const ids=scope==='view'?state.view:state.order.filter(id=>state.tracks.get(id).analysis);
  const nm=($('#xName')?.value||'').trim();const{xml,n,plName}=buildXml(ids,nm);if(!n){toast('Keine analysierten Tracks im Export',1);return}
  download(`${plName.replace(/[\/\\:*?"<>|]/g,'-')}.xml`,xml,'application/xml');closeModal();
  setTimeout(()=>openModal('guide',{n,plName}),300);
}

/* ============ export: Serato ============ */
const enc16=s=>{const b=new Uint8Array(s.length*2);for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);b[2*i]=c>>8;b[2*i+1]=c&255}return b};
function tag(name,payload){const p=payload instanceof Uint8Array?payload:enc16(String(payload));const b=new Uint8Array(8+p.length);for(let i=0;i<4;i++)b[i]=name.charCodeAt(i);new DataView(b.buffer).setUint32(4,p.length);b.set(p,8);return b}
const cat=arrs=>{const n=arrs.reduce((a,b)=>a+b.length,0);const o=new Uint8Array(n);let p=0;for(const a of arrs){o.set(a,p);p+=a.length}return o};
const u32=v=>{const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v>>>0);return b};
function seratoLoc(path){
  let m=path.match(/^\/Volumes\/([^/]+)\/(.*)$/);if(m)return{vol:m[1],rel:m[2]};
  m=path.match(/^([A-Za-z]):\/(.*)$/);if(m)return{vol:m[1].toUpperCase()+'-Laufwerk',rel:m[2]};
  return{vol:'Systemlaufwerk',rel:path.replace(/^\//,'')};
}
function crateBytes(rels){
  const cols=['song','artist','bpm','key'];
  return cat([tag('vrsn','1.0/Serato ScratchLive Crate'),tag('osrt',cat([tag('tvcn','song'),tag('brev',new Uint8Array([0]))])),
    ...cols.map(c=>tag('ovct',cat([tag('tvcn',c),tag('tvcw','0')]))),...rels.map(r=>tag('otrk',tag('ptrk',r)))]);
}
function dbBytes(tracks){
  const parts=[tag('vrsn','2.0/Serato Scratch LIVE Database')];
  for(const t of tracks){const L=seratoLoc(t.path);const f=[tag('ttyp',(t.fname.split('.').pop()||'').toLowerCase()),tag('pfil',L.rel),tag('tsng',t.title)];
    if(t.artist)f.push(tag('tart',t.artist));if(t.album)f.push(tag('talb',t.album));if(t.genre)f.push(tag('tgen',t.genre));
    if(t.bpm)f.push(tag('tbpm',t.bpm.toFixed(2)));if(t.key)f.push(tag('tkey',CAM2KEY[t.cam]||t.keyRaw));
    if(t.dur)f.push(tag('tlen',`${String(Math.floor(t.dur/60)).padStart(2,'0')}:${String(Math.floor(t.dur%60)).padStart(2,'0')}.00`));
    const now=Math.floor(Date.now()/1000);f.push(tag('tadd',String(now)),tag('uadd',u32(now)),tag('bmis',new Uint8Array([0])));
    parts.push(tag('otrk',cat(f)));}
  return cat(parts);
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){
  const te=new TextEncoder();const loc=[],cen=[];let off=0;
  for(const f of files){const nm=te.encode(f.name),d=f.data instanceof Uint8Array?f.data:te.encode(f.data),crc=crc32(d);
    const h=new Uint8Array(30+nm.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint32(14,crc,true);v.setUint32(18,d.length,true);v.setUint32(22,d.length,true);v.setUint16(26,nm.length,true);h.set(nm,30);
    const c=new Uint8Array(46+nm.length),w=new DataView(c.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x0800,true);w.setUint32(16,crc,true);w.setUint32(20,d.length,true);w.setUint32(24,d.length,true);w.setUint16(28,nm.length,true);w.setUint32(42,off,true);c.set(nm,46);
    loc.push(h,d);cen.push(c);off+=h.length+d.length}
  const cs=cen.reduce((a,b)=>a+b.length,0);const e=new Uint8Array(22),ev=new DataView(e.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,cs,true);ev.setUint32(16,off,true);
  return new Blob([...loc,...cen,e],{type:'application/zip'});
}
function exportSerato(){
  const chosen=$$('#modal .plsel input:checked').map(i=>+i.value);if(!chosen.length){toast('Keine Playlist gewählt',1);return}
  const useSort=$('#srtSort')?.checked,withDb=$('#srtDb')?.checked;
  const groups=new Map();const files=[];
  for(const idx of chosen){const p=state.playlists[idx];let ids=p.ids;
    if(useSort&&idx===state.cur){const set=new Set(ids);const sv=[...state.view].filter(id=>set.has(id));ids=[...sv,...ids.filter(id=>!sv.includes(id))]}
    const byVol=new Map();for(const id of ids){const t=state.tracks.get(id);const L=seratoLoc(t.path);if(!byVol.has(L.vol))byVol.set(L.vol,[]);byVol.get(L.vol).push(L.rel);
      if(!groups.has(L.vol))groups.set(L.vol,new Map());groups.get(L.vol).set(id,t)}
    const cname=[...p.folder,p.name].map(s=>s.replace(/[\/\\:*?"<>|%]/g,'-')).join('%%');
    for(const[vol,rels]of byVol)files.push({vol,name:`_Serato_/Subcrates/${cname}.crate`,data:crateBytes(rels)});
  }
  const multi=groups.size>1;
  if(withDb)for(const[vol,m]of groups)files.push({vol,name:'_Serato_/database V2',data:dbBytes([...m.values()])});
  const vols=[...groups.keys()];
  const readme=`JAILR Prep – Serato Export (${today()})\n\n`+vols.map(v=>v==='Systemlaufwerk'?`• "${multi?v+'/':''}_Serato_" → in deinen Musik-Ordner (Mac: ~/Music/_Serato_) kopieren.`:`• "${multi?v+'/':''}_Serato_" → ins Hauptverzeichnis von "${v}" kopieren (neben PIONEER und Contents).`).join('\n')+
   `\n\nVorher einen vorhandenen _Serato_-Ordner sichern. Bestehende Crates mit gleichem Namen werden ersetzt${withDb?', die "database V2" ebenfalls':''}.\nHot Cues werden nicht übertragen – Serato liest Cues aus den Audiodateien.\n`;
  const zf=files.map(f=>({name:(multi?f.vol+'/':'')+f.name,data:f.data}));zf.push({name:'LIESMICH.txt',data:readme});
  download(`JAILR_Serato_${today()}.zip`,zip(zf));closeModal();
  toast(`${chosen.length} Crates exportiert → ${vols.join(', ')}`);
}

  if(kind==='settings'){
    const on=(id,fn)=>$('#'+id).addEventListener('change',e=>{fn(e.target);saveS();relCache=null;renderMain();renderBar();renderDetail()});
    on('sMix',e=>S.mixBars=+e.value);on('sLoop',e=>S.loopBars=+e.value);on('sSens',e=>S.sens=clamp(+e.value||3,1,12));on('sMode',e=>S.energyMode=e.value);
    on('sOver',e=>S.overwrite=e.checked);on('sRate',e=>S.writeRating=e.checked);on('sCom',e=>S.writeComment=e.checked);
  }
}
function closeModal(){$('#modalBg').classList.remove('on')}

/* ============ events ============ */
async function readXmlFile(f){try{loadXml(await f.text(),f.name)}catch(e){toast(e.message,1)}}
$('#inXml').addEventListener('change',e=>{const f=e.target.files[0];if(f)readXmlFile(f);e.target.value=''});
$('#inDir').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});
$('#pillXml').onclick=()=>$('#inXml').click();$('#pillMusic').onclick=()=>$('#inDir').click();
$('#btnSide').onclick=()=>{if(matchMedia('(max-width:900px)').matches)document.body.classList.toggle('showside');else document.body.classList.toggle('noside');setTimeout(drawTL,50)};
$('#btnSettings').onclick=()=>openModal('settings');$('#btnHelp').onclick=()=>openModal('guide');
$('#btnCancel').onclick=()=>{state.cancel=true};
$('#btnAnalyze').onclick=()=>analyzeIds(state.sel.size>1?[...state.sel]:state.view);
$('#btnExport').onclick=e=>{e.stopPropagation();$('#exportMenu').classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))$('#exportMenu').classList.remove('open')});
$('#exportMenu').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#exportMenu').classList.remove('open');openModal(b.dataset.act)};
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg'||e.target.closest('[data-close]'))closeModal();const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='doXml')exportXml();if(a.dataset.act==='doSerato')exportSerato()}});
$('#main').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='xml')$('#inXml').click();if(a.dataset.act==='dir')$('#inDir').click();if(a.dataset.act==='help')openModal('guide');return}
  const th=e.target.closest('th[data-sort]');if(th){const k=th.dataset.sort;const i=state.sort.findIndex(s=>s.k===k);
    if(e.shiftKey){if(i>=0)state.sort[i].d*=-1;else state.sort.push({k,d:k==='energy'?-1:1})}
    else{if(i===0&&state.sort.length===1)state.sort[0].d*=-1;else state.sort=[{k,d:1}]}
    state.sort=state.sort.filter((s,j,arr)=>!(s.k==='idx'&&arr.length>1));renderBar();renderMain();return}
  const tr=e.target.closest('tbody tr');if(!tr)return;const id=tr.dataset.id;
  if(e.shiftKey&&state.anchor){const i0=state.view.indexOf(state.anchor),i1=state.view.indexOf(id);state.sel=new Set(state.view.slice(Math.min(i0,i1),Math.max(i0,i1)+1))}
  else if(e.metaKey||e.ctrlKey){state.sel.has(id)?state.sel.delete(id):state.sel.add(id);state.anchor=id}
  else{state.sel=new Set([id]);state.anchor=id}
  if(state.focus!==id){stop();state.focus=id;renderDetail()}updateSel();
});
$('#main').addEventListener('dblclick',e=>{const tr=e.target.closest('tbody tr');if(!tr)return;const t=state.tracks.get(tr.dataset.id);if(t.analysis)jump('A');else analyzeIds([t.id])});
$('#side').addEventListener('click',e=>{const f=e.target.closest('[data-folder]');if(f){const k=f.dataset.folder;state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k);renderSide();return}
  const p=e.target.closest('[data-pl]');if(!p)return;state.cur=+p.dataset.pl;state.sel.clear();state.focus=null;stop();document.body.classList.remove('showside');renderAll();$('#main').scrollTop=0});
$('#q').addEventListener('input',e=>{state.q=e.target.value;renderMain()});
$('#filt').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;state.filter=b.dataset.f;renderBar();renderMain()});
$('#sorts').addEventListener('click',e=>{const d=e.target.closest('[data-dir]'),r=e.target.closest('[data-rm]');
  if(d){state.sort[+d.dataset.dir].d*=-1}else if(r){state.sort.splice(+r.dataset.rm,1);if(!state.sort.length)state.sort=[{k:'idx',d:1}]}else return;renderBar();renderMain()});
$('#sorts').addEventListener('change',e=>{if(e.target.id!=='addSort')return;const v=e.target.value;if(!v)return;
  if(v.startsWith('p:'))state.sort={harm:[{k:'key',d:1},{k:'bpm',d:1},{k:'energy',d:1}],build:[{k:'energy',d:1},{k:'bpm',d:1},{k:'key',d:1}],peak:[{k:'energy',d:-1},{k:'bpm',d:-1}]}[v.slice(2)];
  else{state.sort=state.sort.filter(s=>s.k!=='idx');state.sort.push({k:v,d:v==='energy'?-1:1})}renderBar();renderMain()});
let dragI=null;
$('#sorts').addEventListener('dragstart',e=>{const c=e.target.closest('.chip');if(!c)return;dragI=+c.dataset.i;c.classList.add('drag');e.dataTransfer.effectAllowed='move'});
$('#sorts').addEventListener('dragover',e=>{const c=e.target.closest('.chip');if(c&&dragI!==null){e.preventDefault();$$('.chip').forEach(x=>x.classList.toggle('over',x===c))}});
$('#sorts').addEventListener('drop',e=>{const c=e.target.closest('.chip');if(!c||dragI===null)return;e.preventDefault();e.stopPropagation();const to=+c.dataset.i;const[s]=state.sort.splice(dragI,1);state.sort.splice(to,0,s);dragI=null;renderBar();renderMain()});
$('#sorts').addEventListener('dragend',()=>{dragI=null;$$('.chip').forEach(x=>x.classList.remove('drag','over'))});
// detail
$('#btnPlay').onclick=()=>{if(PB.src)stop();else{const t=state.tracks.get(state.focus);const ct=t?.analysis?cueTimes(t):null;play(ct?ct.A:0)}};
$('#dJumps').onclick=e=>{const b=e.target.closest('[data-jump]');if(b)jump(b.dataset.jump)};
$('#btnReset').onclick=()=>{const t=state.tracks.get(state.focus);if(!t)return;t.manual=null;IDB.put('manual',t.loc,null);updateRow(t);renderDetail()};
$('#btnReanalyze').onclick=()=>{const t=state.tracks.get(state.focus);if(t)analyzeIds([t.id],true)};
const cv=$('#tl');
cv.addEventListener('mousedown',e=>{const g=tlGeom();if(!g.a)return;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left;const ct=cueTimes(g.t);
  const hit=['G','F','A','L'].find(k=>Math.abs(g.x(k==='L'?ct.L0:ct[k])-mx)<7);
  if(hit){TL.drag=hit;e.preventDefault()}else{play(g.s(mx>3?barT(g.a,nearestBar(g.a,g.s(mx))):0))}});
window.addEventListener('mousemove',e=>{const g=tlGeom();if(!g.a)return;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left;const tip=$('#tlTip');
  if(TL.drag){const b=Math.max(0,Math.min(g.a.rms.length-1,nearestBar(g.a,g.s(mx))));setManual(g.t,TL.drag,b);drawTL();tip.style.display='block';tip.style.left=(14+g.x(barT(g.a,b))+6)+'px';tip.textContent=`${TL.drag} → Bar ${b+1} · ${fmtT(barT(g.a,b))}`;return}
  if(e.target===cv){TL.hover=nearestBar(g.a,g.s(mx));const ct=cueTimes(g.t);const near=['G','F','A','L'].some(k=>Math.abs(g.x(k==='L'?ct.L0:ct[k])-mx)<7);cv.style.cursor=near?'ew-resize':'crosshair';
    tip.style.display='block';tip.style.left=(14+mx+10)+'px';tip.textContent=`Bar ${TL.hover+1} · ${fmtT(barT(g.a,TL.hover))}`;drawTL()}
  else if(TL.hover>=0){TL.hover=-1;tip.style.display='none';drawTL()}});
window.addEventListener('mouseup',()=>{if(TL.drag){const t=state.tracks.get(state.focus);TL.drag=null;$('#tlTip').style.display='none';updateRow(t);renderDetail()}});
window.addEventListener('resize',()=>drawTL());
// keyboard
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea')){if(e.key==='Escape')e.target.blur();return}
  if($('#modalBg').classList.contains('on')){if(e.key==='Escape')closeModal();return}
  if(!state.doc)return;const v=state.view;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let i=v.indexOf(state.focus);i=e.key==='ArrowDown'?Math.min(v.length-1,i+1):Math.max(0,i-1);if(i<0)i=0;const id=v[i];if(!id)return;
    if(e.shiftKey){state.sel.add(id)}else{state.sel=new Set([id]);state.anchor=id}stop();state.focus=id;updateSel();renderDetail();$(`tr[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({block:'nearest'});return}
  if(e.key==='Enter'){analyzeIds(state.sel.size?[...state.sel]:v);return}
  if(e.key===' '){e.preventDefault();$('#btnPlay').click();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'){e.preventDefault();state.sel=new Set(v);updateSel();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toUpperCase();if(['A','F','G','L'].includes(k)){jump(k);return}
  if(k==='R'){$('#btnReset').click();return}
  if(e.key==='/'){e.preventDefault();$('#q').focus();return}
  if(e.key==='?'){openModal('guide');return}
  if(e.key==='Escape'){state.sel.clear();updateSel()}
});
// drag & drop
let dragDepth=0;
window.addEventListener('dragenter',e=>{if(e.dataTransfer.types.includes('Files')){dragDepth++;$('#drop').classList.add('on')}});
window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#drop').classList.remove('on')});
window.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files'))e.preventDefault()});
window.addEventListener('drop',async e=>{if(!e.dataTransfer.types.includes('Files'))return;e.preventDefault();dragDepth=0;$('#drop').classList.remove('on');
  const items=[...e.dataTransfer.items];const files=await readDropEntries(items);
  const xml=files.find(f=>/\.xml$/i.test(f.name));if(xml)await readXmlFile(xml);
  const aud=files.filter(f=>AUDIO_RE.test(f.name));if(aud.length)addFiles(aud)});
renderAll();
</script>
</body>
