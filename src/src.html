<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!--CSP-->
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>JAILR Prep – Cue & Energy Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311100F'/%3E%3Cpath d='M8 22V10M13 22V14M18 22V8M23 22V16' stroke='%23F4F0E8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:300 700;font-display:swap;src:url(data:font/woff2;base64,__FONT__) format("woff2")}
:root{
  --bg:#11100F;--bg2:#171614;--bg3:#1E1C1A;--bg4:#262320;--line:#2B2825;--line2:#3B3732;
  --fg:#F4F0E8;--fg2:#BDB6AA;--fg3:#7F786E;
  --cA:#28E214;--cF:#FF9A1F;--cG:#F0443A;--cL:#3D9BFF;
  --ok:#4CD07D;--warn:#FFB224;--err:#F0443A;
  font-family:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
body{display:grid;height:100vh;overflow:hidden;grid-template-columns:var(--side,240px) 1fr;grid-template-rows:56px auto 1fr auto;grid-template-areas:"top top" "side bar" "side main" "side detail"}
body.noside{--side:0px}
header{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:14px;white-space:nowrap}
.logo small{font-weight:500;letter-spacing:.08em;color:var(--fg3);font-size:11px}
.logo .mark{width:26px;height:26px;border-radius:7px;background:var(--fg);display:grid;place-items:center}
.pills{display:flex;gap:6px;margin-left:8px;min-width:0;overflow:hidden}
.pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);color:var(--fg2);font-size:12px;white-space:nowrap;cursor:pointer}
.pill:hover{border-color:var(--line2);color:var(--fg)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.pill.ok .dot{background:var(--ok)}.pill.warn .dot{background:var(--warn)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg3);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--bg4);border-color:#4a453f}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg3)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn.okb{border-color:#2f5a3e;color:var(--ok)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
kbd{font-family:inherit;font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid var(--line2);background:var(--bg3);color:var(--fg2)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:38px;min-width:270px;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:6px;z-index:40;box-shadow:0 12px 40px rgba(0,0,0,.5);display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;gap:10px;align-items:flex-start;text-align:left;padding:8px 10px;border:0;background:none;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--bg4)}
.menu button small{display:block;color:var(--fg3);font-size:11px;margin-top:2px}
aside{grid-area:side;border-right:1px solid var(--line);overflow:auto;padding:10px 8px}
body.noside aside{display:none}
.side-h{font-size:10px;letter-spacing:.14em;color:var(--fg3);padding:8px 8px 6px;text-transform:uppercase}
.pl{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--fg2);user-select:none}
.pl:hover{background:var(--bg3);color:var(--fg)}
.pl.active{background:var(--bg4);color:var(--fg)}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .ct{font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.pl .prog{width:22px;height:3px;border-radius:2px;background:var(--line2);overflow:hidden;flex:none}
.pl .prog i{display:block;height:100%;background:var(--ok)}
.pl.folder{color:var(--fg3);font-size:12px}
.pl .chev{width:12px;transition:transform .15s}
.pl.collapsed .chev{transform:rotate(-90deg)}
.bar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);min-width:200px;flex:0 1 260px}
.search input{border:0;background:none;outline:none;width:100%}
.search:focus-within{border-color:var(--fg3)}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--fg2);font-size:12px}
.seg button.on{background:var(--bg4);color:var(--fg)}
.seg button .n{color:var(--fg3);margin-left:4px;font-variant-numeric:tabular-nums}
.sorts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sorts .lbl{color:var(--fg3);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 4px 0 9px;border-radius:7px;background:var(--bg3);border:1px solid var(--line2);cursor:grab;font-size:12px;user-select:none}
.chip .lv{font-size:10px;color:var(--fg3)}
.chip .dir,.chip .x{border:0;background:none;cursor:pointer;padding:2px 5px;border-radius:4px}
.chip .x{color:var(--fg3)}
.chip .dir:hover,.chip .x:hover{background:var(--bg4)}
.chip.drag{opacity:.4}.chip.over{border-color:var(--fg)}
select.add{height:28px;border-radius:7px;background:var(--bg2);border:1px dashed var(--line2);padding:0 6px;color:var(--fg2);font-size:12px;cursor:pointer}
main{grid-area:main;overflow:auto;position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;table-layout:auto}
thead th{position:sticky;top:0;background:var(--bg);z-index:2;text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;height:34px}
thead th:hover{color:var(--fg)}
thead th .si{font-size:10px;color:var(--fg);margin-left:3px}
tbody tr.r td{height:46px;padding:0 8px;border-bottom:1px solid #1c1a18;white-space:nowrap;vertical-align:middle;overflow:hidden}
tbody tr.r:hover td{background:#191816}
tbody tr.r.sel td{background:#24211d}
tbody tr.r.focus td:first-child{box-shadow:inset 2px 0 0 var(--fg)}
tbody tr.sp td{padding:0;border:0}
td.num{color:var(--fg3);width:36px;text-align:right}
td.tt{max-width:320px;min-width:180px}
td.tt .ti{font-weight:600;overflow:hidden;text-overflow:ellipsis;line-height:18px}
td.tt .ar{color:var(--fg3);font-size:12px;overflow:hidden;text-overflow:ellipsis;line-height:15px}
td.r,th.r{text-align:right}
.kc{display:inline-block;min-width:34px;text-align:center;padding:2px 6px;border-radius:5px;font-weight:600;font-size:12px;background:hsl(var(--h) 55% 22%);color:hsl(var(--h) 85% 78%)}
.kn{color:var(--fg3);font-size:11px;margin-left:5px}
.meter{display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:middle}
.meter i{width:4px;border-radius:1px;background:var(--line2)}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:7px}.meter i:nth-child(3){height:9px}.meter i:nth-child(4){height:11px}.meter i:nth-child(5){height:14px}
.meter[data-s="1"] i:nth-child(-n+1){background:#5B8CFF}
.meter[data-s="2"] i:nth-child(-n+2){background:#45C2D8}
.meter[data-s="3"] i:nth-child(-n+3){background:#7BD65A}
.meter[data-s="4"] i:nth-child(-n+4){background:#FFB224}
.meter[data-s="5"] i:nth-child(-n+5){background:#F0443A}
.esc{color:var(--fg3);font-size:11px;margin-left:6px}
.man{color:var(--fg);font-size:10px;margin-left:3px}
.gn,.kb{font-size:12px;color:var(--fg3)}.gn.mid,.kb.mid{color:var(--warn)}.gn.bad,.kb.bad{color:var(--err);font-weight:600}
.cues{display:inline-flex;gap:3px}
.cb{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;font-size:10px;font-weight:700;background:var(--bg3);color:var(--fg3);border:1px solid var(--line)}
.cb.on{color:#111;border-color:transparent}
.cb.A.on{background:var(--cA)}.cb.F.on{background:var(--cF)}.cb.G.on{background:var(--cG)}.cb.L.on{background:var(--cL)}
.cb.kept{background:transparent;border:1px solid var(--fg3);color:var(--fg2)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--fg3)}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.err{color:var(--err)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--fg);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
svg.spark{display:block}
.empty{max-width:760px;margin:6vh auto;padding:0 24px}
.empty h1{font-size:28px;letter-spacing:-.01em;margin:0 0 6px}
.empty p{color:var(--fg2);line-height:1.55;margin:0 0 22px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.step{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column}
.step b{display:block;font-size:11px;letter-spacing:.12em;color:var(--fg3);margin-bottom:8px}
.step h3{margin:0 0 6px;font-size:15px}
.step p{font-size:12px;margin:0 0 12px;color:var(--fg2);flex:1}
.step .row{display:flex;gap:6px;flex-wrap:wrap}
.step.done{border-color:#2f5a3e}.step.done b{color:var(--ok)}
.drop{position:fixed;inset:0;background:rgba(17,16,15,.86);border:2px dashed var(--fg);display:none;place-items:center;z-index:60;font-size:20px;font-weight:600}
.drop.on{display:grid}
.detail{grid-area:detail;border-top:1px solid var(--line);background:var(--bg2);min-height:0}
.detail.hidden{display:none}
.dh{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;flex-wrap:wrap}
.dh .tn{font-weight:700;font-size:15px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .ta{color:var(--fg3)}
.facts{display:flex;gap:14px;color:var(--fg2);font-size:12px;margin-left:6px;align-items:center;flex-wrap:wrap}
.facts b{color:var(--fg);font-weight:600}
.estars{display:inline-flex;gap:2px;align-items:flex-end;height:16px;vertical-align:middle;margin-left:4px}
.estars button{width:7px;border:0;border-radius:1px;padding:0;background:var(--line2);cursor:pointer}
.estars button.on{background:var(--fg)}
.estars button:nth-child(1){height:6px}.estars button:nth-child(2){height:8px}.estars button:nth-child(3){height:11px}.estars button:nth-child(4){height:13px}.estars button:nth-child(5){height:16px}
.lnk{border:0;background:none;color:var(--fg3);text-decoration:underline;cursor:pointer;font-size:11px;padding:0}
.jumps{display:flex;gap:6px}
.jb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--line2);background:var(--bg3);cursor:pointer;font-size:12px}
.jb:hover{background:var(--bg4)}
.jb.sel{border-color:var(--fg)}
.jb i{width:8px;height:8px;border-radius:2px;display:block}
.jb .t{color:var(--fg3);font-variant-numeric:tabular-nums}
.tl-wrap{padding:4px 14px 6px;position:relative}
canvas#tl{width:100%;height:132px;display:block;border-radius:8px;background:var(--bg);cursor:crosshair}
.tl-tip{position:absolute;top:0;pointer-events:none;background:var(--bg4);border:1px solid var(--line2);padding:2px 6px;border-radius:5px;font-size:11px;display:none;white-space:nowrap}
.dfoot{display:flex;gap:14px;padding:0 14px 10px;color:var(--fg3);font-size:12px;flex-wrap:wrap;align-items:center}
.flag{color:var(--warn)}.flag.e{color:var(--err)}
.progress{display:none;align-items:center;gap:10px;font-size:12px;color:var(--fg2)}
.progress.on{display:flex}
.pbar{width:140px;height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--fg);width:0;transition:width .2s}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50;padding:20px}
.modal-bg.on{display:grid}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{margin:0;font-size:17px;padding:18px 20px 4px}
.modal h3{font-size:13px;margin:16px 0 6px}
.modal .sub{color:var(--fg3);padding:0 20px 10px;margin:0;font-size:12px}
.modal .body{padding:8px 20px 16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);align-items:center}
.modal .foot .info{margin-right:auto;color:var(--fg3);font-size:12px}
.field{display:grid;grid-template-columns:1fr 200px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:600}
.field small{display:block;color:var(--fg3);font-weight:400;margin-top:2px;line-height:1.4}
.field select,.field input[type=number],.inp{height:32px;border-radius:7px;background:var(--bg3);border:1px solid var(--line2);padding:0 8px;width:100%}
.switch{justify-self:end;position:relative;width:38px;height:22px}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line2);cursor:pointer;transition:.15s}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:var(--fg);transition:.15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--fg)}
ol.guide{padding-left:20px;line-height:1.6;color:var(--fg2)}
ol.guide b{color:var(--fg)}
.note{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--fg2);font-size:12px;line-height:1.5;margin:10px 0}
.note.warn{border-color:#5a4520}.note.err{border-color:#6b2a25}
.opts{border:1px solid var(--line);border-radius:9px;padding:4px;margin:6px 0}
.opts label{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;cursor:pointer;flex-wrap:wrap}
.opts label:hover{background:var(--bg3)}
.opts .c{margin-left:auto;color:var(--fg3);font-size:11px}
.opts .inp{flex:1 1 220px;margin-left:24px;height:30px}
.plsel{max-height:240px;overflow:auto}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.sum div{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.sum b{display:block;font-size:18px}
.sum span{color:var(--fg3);font-size:11px}
.diff{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.diff table td,.diff table th{padding:5px 8px;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;position:static;height:auto;cursor:default}
.diff .tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;background:var(--bg4)}
.diff .neu{color:var(--ok)}.diff .ers{color:var(--warn)}.diff .blb{color:var(--fg3)}.diff .skip{color:var(--err)}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--bg4);border:1px solid var(--line2);padding:10px 14px;border-radius:9px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:ti .2s ease-out}
.toast.err{border-color:#6b2a25}
@keyframes ti{from{transform:translateY(8px);opacity:0}}
.hidden-input{display:none}
@media (max-width:900px){
  body{--side:0px} aside{display:none}
  body.showside{--side:220px} body.showside aside{display:block}
  td.sp,th.sp,td.lu,th.lu,td.du,th.du{display:none}
  .steps{grid-template-columns:1fr} .facts{display:none} .sum{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header>
  <button class="btn ghost icon" id="btnSide" title="Playlists ein/aus" aria-label="Playlists ein- oder ausblenden"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="logo"><div class="mark"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 17V8M10 17V11M14 17V6M18 17V12" stroke="#11100F" stroke-width="2.6" stroke-linecap="round"/></svg></div>JAILR PREP <small>CUE &amp; ENERGY LAB</small></div>
  <div class="pills">
    <button class="pill" id="pillLib" title="rekordbox XML laden"><span class="dot"></span><span>Library laden</span></button>
    <button class="pill" id="pillMusic" title="Musikordner oder USB-Stick verbinden"><span class="dot"></span><span>Musikordner verbinden</span></button>
  </div>
  <div class="spacer"></div>
  <div class="progress" id="progress" role="status"><span id="progTxt"></span><div class="pbar"><i id="progBar"></i></div><button class="btn ghost" id="btnCancel">Stopp</button></div>
  <button class="btn primary" id="btnAnalyze" disabled title="Auswahl oder ganze Playlist analysieren (Enter)"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h3l3-8 4 16 3-8h5"/></svg><span id="btnAnalyzeTxt">Analysieren</span></button>
  <div class="menu-wrap">
    <button class="btn" id="btnExport" disabled aria-haspopup="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Export</button>
    <div class="menu" id="exportMenu" role="menu">
      <button data-act="xml" role="menuitem"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/></svg><div>rekordbox XML<small>Cues, Rating &amp; Energie zurück nach rekordbox</small></div></button>
      <button data-act="serato" role="menuitem"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/></svg><div>Serato Crates<small>Playlists als _Serato_-Ordner (ZIP)</small></div></button>
      <button data-act="csv" role="menuitem"><svg class="i" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div>Problemliste (CSV)<small>Alle Tracks mit Fehlern, Warnungen und was zu tun ist</small></div></button>
    </div>
  </div>
  <button class="btn ghost icon" id="btnSettings" title="Einstellungen" aria-label="Einstellungen"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  <button class="btn ghost icon" id="btnHelp" title="Anleitung & Shortcuts (?)" aria-label="Hilfe"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg></button>
</header>
<aside id="side" aria-label="Playlists"></aside>
<div class="bar" id="bar">
  <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Suchen…  ( / )" autocomplete="off" aria-label="Tracks durchsuchen"></label>
  <div class="seg" id="filt" role="group" aria-label="Filter"></div>
  <div class="sorts" id="sorts"></div>
</div>

<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const fmtT=s=>{if(!isFinite(s))return'–';s=Math.max(0,s);const m=Math.floor(s/60),r=Math.floor(s%60);return m+':'+String(r).padStart(2,'0')};
const r1=x=>Math.round(x*10)/10;
const pct=(arr,p)=>{const a=arr.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return 0;return a[Math.min(a.length-1,Math.floor(p*(a.length-1)))]};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nfc=s=>String(s||'').normalize('NFC');
function toast(msg,err){const d=document.createElement('div');d.className='toast'+(err?' err':'');d.textContent=msg;$('#toasts').append(d);setTimeout(()=>d.remove(),err?7000:3800)}
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const safeName=s=>String(s).replace(/[\/\\:*?"<>|%\x00-\x1f]/g,'-').replace(/^\.+/,'').slice(0,120)||'Playlist';

const ALG_V=6;
const RATING_VAL=[0,51,102,153,204,255];
const ENERGY_T=[48,56,63,70];
const DEFAULTS={mixBars:32,loopBars:8,sens:3,overwrite:false,energyMode:'abs',writeRating:true,writeComment:true,phrase:8,requireConfirm:true,maxMin:20};
const CUE={A:{num:0,name:'Start',rgb:[40,226,20],col:'#28E214'},F:{num:5,name:'Mix-Out Start',rgb:[255,154,31],col:'#FF9A1F'},G:{num:6,name:'Mix-Out Ende',rgb:[240,68,58],col:'#F0443A'},L:{name:'Exit Loop',col:'#3D9BFF'}};
const ERR={nofile:'Audiodatei nicht gefunden',decode:'Datei nicht lesbar',nogrid:'Kein Beatgrid',grid:'Beatgrid unbrauchbar',toolong:'Zu lang',mem:'Zu wenig Speicher',other:'Analyse fehlgeschlagen'};
const FIX={nofile:'Musikordner bzw. Stick (neu) verbinden. Liegt die Datei woanders, den passenden Ordner wählen.',decode:'Format oder Datei defekt. In rekordbox abspielen; falls ok, als MP3 320 / WAV neu exportieren.',nogrid:'Track in rekordbox analysieren (Beatgrid), Library neu exportieren.',grid:'Beatgrid in rekordbox prüfen/korrigieren und neu exportieren.',toolong:`Vermutlich ein DJ-Mix. Wird bewusst übersprungen (Limit in den Einstellungen).`,mem:'Browser-Tab neu laden und weniger Tracks auf einmal analysieren.',other:'„Erneut versuchen“. Bleibt der Fehler, Track in rekordbox prüfen.'};
class AErr extends Error{constructor(code,msg){super(msg||ERR[code]);this.code=code}}

/* ================= keys ================= */
const KEY2CAM={'Abm':'1A','G#m':'1A','Ebm':'2A','D#m':'2A','Bbm':'3A','A#m':'3A','Fm':'4A','Cm':'5A','Gm':'6A','Dm':'7A','Am':'8A','Em':'9A','Bm':'10A','F#m':'11A','Gbm':'11A','Dbm':'12A','C#m':'12A',
'B':'1B','Cb':'1B','F#':'2B','Gb':'2B','Db':'3B','C#':'3B','Ab':'4B','G#':'4B','Eb':'5B','D#':'5B','Bb':'6B','A#':'6B','F':'7B','C':'8B','G':'9B','D':'10B','A':'11B','E':'12B'};
const CAM2KEY={'1A':'Abm','2A':'Ebm','3A':'Bbm','4A':'Fm','5A':'Cm','6A':'Gm','7A':'Dm','8A':'Am','9A':'Em','10A':'Bm','11A':'F#m','12A':'Dbm','1B':'B','2B':'F#','3B':'Db','4B':'Ab','5B':'Eb','6B':'Bb','7B':'F','8B':'C','9B':'G','10B':'D','11B':'A','12B':'E'};
function parseKey(raw){
  if(!raw)return null;let s=String(raw).trim().replace('♯','#').replace('♭','b');
  let m=s.match(/^(\d{1,2})\s*([AB])$/i);if(m){const n=+m[1];if(n>=1&&n<=12)return{n,l:m[2].toUpperCase()}}
  m=s.match(/^(\d{1,2})\s*([dm])$/i);if(m){const o=+m[1];if(o>=1&&o<=12)return{n:((o+6)%12)+1,l:m[2].toLowerCase()==='d'?'B':'A'}}
  s=s.replace(/\s*(minor|min)$/i,'m').replace(/\s*(major|maj)$/i,'');s=s.charAt(0).toUpperCase()+s.slice(1);
  const c=KEY2CAM[s];return c?{n:parseInt(c),l:c.slice(-1)}:null;
}

/* ================= settings & storage ================= */
let S={...DEFAULTS};
try{Object.assign(S,JSON.parse(localStorage.getItem('jailr-prep-settings')||'{}'))}catch(e){}
function saveS(){try{localStorage.setItem('jailr-prep-settings',JSON.stringify(S))}catch(e){}}
const IDB={db:undefined,
  open(){if(this.db!==undefined)return Promise.resolve(this.db);return new Promise(res=>{try{const r=indexedDB.open('jailr-prep',2);r.onupgradeneeded=()=>{for(const n of['analysis','manual'])if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n)};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>{this.db=null;res(null)}}catch(e){this.db=null;res(null)}})},
  async all(st){const db=await this.open();const m=new Map();if(!db)return m;return new Promise(res=>{try{const q=db.transaction(st).objectStore(st).openCursor();q.onsuccess=()=>{const c=q.result;if(c){m.set(c.key,c.value);c.continue()}else res(m)};q.onerror=()=>res(m)}catch(e){res(m)}})},
  async put(st,k,v){const db=await this.open();if(!db)return;return new Promise(res=>{try{const tx=db.transaction(st,'readwrite');v==null?tx.objectStore(st).delete(k):tx.objectStore(st).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})}
};
const mKey=t=>nfc(t.fname).toLowerCase()+'|'+t.size;
const aKey=t=>ALG_V+'|'+mKey(t)+'|'+(t.tempos[0]?t.tempos[0].t.toFixed(3)+'@'+t.tempos[0].bpm:'-');

/* ================= state ================= */
const state={source:null,libName:'',volName:'',tracks:new Map(),order:[],playlists:[],tree:[],cur:-1,collapsed:new Set(),
  sort:[{k:'idx',d:1}],filter:'all',q:'',view:[],idxOf:new Map(),sel:new Set(),focus:null,anchor:null,
  files:new Map(),byRel:new Map(),fileCount:0,busy:false,cancel:false,refLufs:null};
window.APP=state;
function mkTrack(o){
  const t=Object.assign({id:'',el:null,title:'',artist:'',album:'',genre:'',bpm:0,keyRaw:'',dur:0,size:0,rating:0,comments:'',loc:'',path:'',fname:'',kind:'',kbps:0,srate:0,
    tempos:[],marks:[],analysis:null,manual:null,file:null,fileAmb:false,status:'idle',errCode:'',error:''},o);
  t.key=parseKey(t.keyRaw);t.cam=t.key?t.key.n+t.key.l:'';t.keyName=t.key?(CAM2KEY[t.cam]||t.keyRaw):t.keyRaw;
  return t;
}
function resetLib(){state.tracks.clear();state.order=[];state.playlists=[];state.tree=[];state.sel.clear();state.focus=null;HIST.length=0}

/* ================= import: rekordbox XML ================= */
function locToPath(loc){let s=loc||'';s=s.replace(/^file:\/\/localhost/i,'').replace(/^file:\/\//i,'');try{s=decodeURIComponent(s)}catch(e){}if(/^\/[A-Za-z]:\//.test(s))s=s.slice(1);return nfc(s)}
function loadXml(text,name){
  if(/<!DOCTYPE|<!ENTITY/i.test(text.slice(0,4096)))throw new Error('XML mit DOCTYPE/ENTITY wird aus Sicherheitsgründen nicht geladen. Bitte direkt aus rekordbox exportieren.');
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')||!doc.querySelector('DJ_PLAYLISTS'))throw new Error('Das ist keine gültige rekordbox-XML-Datei.');
  resetLib();state.source='xml';state.libName=name;state.product=doc.querySelector('PRODUCT')?.getAttribute('Version')||'';
  const byLoc=new Map();
  for(const el of doc.querySelectorAll('COLLECTION > TRACK')){
    const g=a=>el.getAttribute(a)||'';const path=locToPath(g('Location'));
    const t=mkTrack({id:g('TrackID'),el,title:g('Name')||path.split('/').pop(),artist:g('Artist'),album:g('Album'),genre:g('Genre'),bpm:+g('AverageBpm')||0,keyRaw:g('Tonality'),
      dur:+g('TotalTime')||0,size:+g('Size')||0,rating:+g('Rating')||0,comments:g('Comments'),loc:g('Location'),path,fname:path.split('/').pop(),kind:g('Kind'),kbps:+g('BitRate')||0,srate:+g('SampleRate')||0,
      tempos:[...el.querySelectorAll('TEMPO')].map(x=>({t:+x.getAttribute('Inizio'),bpm:+x.getAttribute('Bpm'),beat:+(x.getAttribute('Battito')||1)})).filter(x=>x.bpm>0&&isFinite(x.t)),
      marks:[...el.querySelectorAll('POSITION_MARK')].map(x=>({num:+x.getAttribute('Num'),type:+x.getAttribute('Type'),start:+x.getAttribute('Start'),end:x.hasAttribute('End')?+x.getAttribute('End'):null,name:x.getAttribute('Name')||''}))});
    if(!t.id)continue;state.tracks.set(t.id,t);state.order.push(t.id);byLoc.set(g('Location'),t.id);
  }
  const walk=(node,depth,path)=>{for(const ch of [...node.children].filter(c=>c.tagName==='NODE')){const nm=ch.getAttribute('Name')||'';
    if(ch.getAttribute('Type')==='0'){const fp=[...path,nm];state.tree.push({type:'folder',name:nm,depth,key:fp.join('/')});walk(ch,depth+1,fp)}
    else{const kt=ch.getAttribute('KeyType');const ids=[...ch.children].filter(c=>c.tagName==='TRACK').map(c=>kt==='1'?byLoc.get(c.getAttribute('Key')):c.getAttribute('Key')).filter(id=>state.tracks.has(id));
      const idx=state.playlists.length;state.playlists.push({name:nm,folder:path,ids});state.tree.push({type:'list',name:nm,depth,idx,parent:path.join('/')})}}};
  const root=doc.querySelector('PLAYLISTS > NODE');if(root)walk(root,0,[]);
  afterLoad();
}

/* ================= import: rekordbox USB export (export.pdb + ANLZ) ================= */
const RB={
  str(dv,o){const b=dv.getUint8(o);
    if(b&1){const n=(b>>1)-1;let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(dv.getUint8(o+1+i));return s}
    const len=dv.getUint16(o+1,true)-4,st=o+4;if(len<0||st+len>dv.byteLength)return'';
    if(b===0x90){let s='';for(let i=0;i+1<len;i+=2)s+=String.fromCharCode(dv.getUint16(st+i,true));return s}
    return new TextDecoder('utf-8').decode(new Uint8Array(dv.buffer,dv.byteOffset+st,len))},
  rows(dv,type){
    const lp=dv.getUint32(4,true),nt=dv.getUint32(8,true);if(lp<512||lp>65536||nt>64)throw new Error('export.pdb unbekanntes Format');
    let t=null;for(let i=0;i<nt;i++){const o=0x1c+i*16;if(dv.getUint32(o,true)===type){t={first:dv.getUint32(o+8,true),last:dv.getUint32(o+12,true)};break}}
    if(!t)return[];const out=[];let p=t.first;const seen=new Set();
    while(!seen.has(p)&&seen.size<200000){seen.add(p);const ps=p*lp;if(ps+lp>dv.byteLength)break;
      if(dv.getUint32(ps+8,true)===type&&!(dv.getUint8(ps+0x1b)&0x40)){
        const small=dv.getUint8(ps+0x18),large=dv.getUint16(ps+0x22,true);const n=(large>small&&large!==0x1fff)?large:small;const groups=n?Math.floor((n-1)/16)+1:0;
        for(let g=0;g<groups;g++){const base=ps+lp-g*0x24;const pres=dv.getUint16(base-4,true);
          for(let r=0;r<16&&g*16+r<n;r++){if((pres>>r)&1){const ofs=dv.getUint16(base-6-2*r,true);if(0x28+ofs<lp)out.push(ps+0x28+ofs)}}}}
      if(p===t.last)break;p=dv.getUint32(ps+12,true)}
    return out},
  parse(buf){
    const dv=new DataView(buf);const S_=o=>{try{return RB.str(dv,o)}catch(e){return''}};
    const named=(type,idOfs,nameOf)=>{const m=new Map();for(const o of RB.rows(dv,type)){try{m.set(dv.getUint32(o+idOfs,true),nameOf(o))}catch(e){}}return m};
    const artists=named(2,4,o=>{const st=dv.getUint16(o,true);return S_(o+(st===0x64?dv.getUint16(o+0x0a,true):dv.getUint8(o+9)))});
    const albums=named(3,12,o=>{const st=dv.getUint16(o,true);return S_(o+(st===0x84?dv.getUint16(o+0x16,true):dv.getUint8(o+0x15)))});
    const genres=named(1,0,o=>S_(o+4)),keys=named(5,0,o=>S_(o+8));
    const tracks=[];
    for(const o of RB.rows(dv,0)){try{const u4=x=>dv.getUint32(o+x,true),u2=x=>dv.getUint16(o+x,true),s=i=>S_(o+u2(0x5e+2*i));
      tracks.push({id:u4(0x48),sr:u4(0x08),size:u4(0x10),key:keys.get(u4(0x20))||'',bitrate:u4(0x30),bpm:u4(0x38)/100,genre:genres.get(u4(0x3c))||'',album:albums.get(u4(0x40))||'',
        artist:artists.get(u4(0x44))||'',dur:u2(0x54),rating:dv.getUint8(o+0x59),anlz:s(14),comment:s(16),title:s(17),file:s(19),path:s(20)})}catch(e){}}
    const tree=RB.rows(dv,7).map(o=>({parent:dv.getUint32(o,true),sort:dv.getUint32(o+8,true),id:dv.getUint32(o+12,true),folder:dv.getUint32(o+16,true)!==0,name:S_(o+20)}));
    const entries=RB.rows(dv,8).map(o=>({idx:dv.getUint32(o,true),track:dv.getUint32(o+4,true),pl:dv.getUint32(o+8,true)}));
    return{tracks,tree,entries}},
  anlz(buf){
    const dv=new DataView(buf);const id=o=>String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3));
    if(dv.byteLength<28||id(0)!=='PMAI')return{beats:[],cob:[],co2:[]};
    let p=dv.getUint32(4);const beats=[],cob=[],co2=[];let guard=0;
    while(p+12<=dv.byteLength&&guard++<1000){const tag=id(p),lh=dv.getUint32(p+4),lt=dv.getUint32(p+8);if(lt<12||p+lt>dv.byteLength)break;
      if(tag==='PQTZ'){const n=dv.getUint32(p+20);for(let i=0;i<n;i++){const b=p+24+i*8;if(b+8>p+lt)break;beats.push({n:dv.getUint16(b),bpm:dv.getUint16(b+2)/100,t:dv.getUint32(b+4)/1000})}}
      else if(tag==='PCOB'){const hot=dv.getUint32(p+12)===1;let q=p+lh;
        while(q+40<=p+lt&&id(q)==='PCPT'){const ql=dv.getUint32(q+8)||56;const st=dv.getUint32(q+16),hc=dv.getUint32(q+12),ty=dv.getUint8(q+28),tm=dv.getUint32(q+32),lt2=dv.getUint32(q+36);
          if(st!==0)cob.push({num:hot?hc-1:-1,type:ty===2?4:0,start:tm/1000,end:ty===2&&lt2!==0xffffffff?lt2/1000:null,name:''});q+=ql}}
      else if(tag==='PCO2'){let q=p+lh;
        while(q+28<=p+lt&&id(q)==='PCP2'){const ql=dv.getUint32(q+8)||0x90;const hc=dv.getUint32(q+12),ty=dv.getUint8(q+16),tm=dv.getUint32(q+20),lt2=dv.getUint32(q+24);
          co2.push({num:hc?hc-1:-1,type:ty===2?4:0,start:tm/1000,end:ty===2&&lt2!==0xffffffff?lt2/1000:null,name:''});q+=ql}}
      p+=lt}
    return{beats,cob,co2}}
};
async function loadUsb(files){
  const pdbF=files.find(f=>/(^|\/)PIONEER\/rekordbox\/export\.pdb$/i.test(relOf(f)));
  const rp=relOf(pdbF);const root=rp.slice(0,rp.search(/PIONEER\/rekordbox\/export\.pdb$/i));
  const vol=(root.split('/').filter(Boolean)[0])||'USB';
  const lib=RB.parse(await pdbF.arrayBuffer());
  if(!lib.tracks.length)throw new Error('Keine Tracks in export.pdb gefunden.');
  const fm=new Map(files.map(f=>[nfc(relOf(f)).toLowerCase(),f]));
  const get=p=>fm.get(nfc(root+String(p).replace(/^\//,'')).toLowerCase());
  resetLib();state.source='usb';state.libName=vol+' (USB)';state.volName=vol;state.usbRoot=root;state.product='';
  const kindOf=f=>({mp3:'MP3 File',wav:'WAV File',aif:'AIFF File',aiff:'AIFF File',flac:'FLAC File',m4a:'M4A File',mp4:'M4A File'}[(f.split('.').pop()||'').toLowerCase()]||'');
  let i=0;
  for(const r of lib.tracks){
    const t=mkTrack({id:String(r.id),title:r.title||r.file,artist:r.artist,album:r.album,genre:r.genre,bpm:r.bpm,keyRaw:r.key,dur:r.dur,size:r.size,rating:RATING_VAL[clamp(r.rating,0,5)]||0,
      comments:r.comment,path:'/Volumes/'+vol+r.path,usbRel:r.path,fname:r.path.split('/').pop(),kind:kindOf(r.path),kbps:r.bitrate,srate:r.sr});
    t.loc='usb:'+r.path;
    const dat=get(r.anlz),ext=r.anlz?get(r.anlz.replace(/\.DAT$/i,'.EXT')):null;
    try{if(dat){const a=RB.anlz(await dat.arrayBuffer());let co2=[];if(ext){co2=RB.anlz(await ext.arrayBuffer()).co2}
      const tem=[];let prev=null;for(const b of a.beats){if(prev===null||Math.abs(b.bpm-prev)>0.005){tem.push({t:b.t,bpm:b.bpm,beat:b.n||1});prev=b.bpm}}
      t.tempos=tem;t.marks=co2.length?co2:a.cob}}catch(e){}
    t.file=get(r.path)||null;
    state.tracks.set(t.id,t);state.order.push(t.id);if(++i%60===0)await sleep(0);
  }
  const byParent=new Map();for(const n of lib.tree){if(!byParent.has(n.parent))byParent.set(n.parent,[]);byParent.get(n.parent).push(n)}
  const walk=(pid,depth,path)=>{for(const n of(byParent.get(pid)||[]).sort((a,b)=>a.sort-b.sort)){
    if(n.folder){const fp=[...path,n.name];state.tree.push({type:'folder',name:n.name,depth,key:fp.join('/')});walk(n.id,depth+1,fp)}
    else{const ids=lib.entries.filter(e=>e.pl===n.id).sort((a,b)=>a.idx-b.idx).map(e=>String(e.track)).filter(id=>state.tracks.has(id));
      const idx=state.playlists.length;state.playlists.push({name:n.name,folder:path,ids});state.tree.push({type:'list',name:n.name,depth,idx,parent:path.join('/')})}}};
  walk(0,0,[]);
  addFiles(files,true);
  afterLoad();
}
async function afterLoad(){
  state.cur=state.playlists.length?0:-1;state.sel.clear();state.focus=null;
  if(state.source==='xml')matchFiles();
  const[an,mn]=await Promise.all([IDB.all('analysis'),IDB.all('manual')]);let n=0;
  for(const t of state.tracks.values()){const m=mn.get(mKey(t));if(m)t.manual=m;const a=an.get(aKey(t));if(a&&a.v===ALG_V){t.analysis=a;t.status='done';n++}}
  renderAll();
  const nf=[...state.tracks.values()].filter(t=>!t.tempos.length).length;
  toast(`${state.tracks.size} Tracks · ${state.playlists.length} Playlists geladen${n?` · ${n} frühere Analysen wiederhergestellt`:''}${nf?` · ${nf} ohne Beatgrid`:''}`);
}

/* ================= music files ================= */
const AUDIO_RE=/\.(mp3|wav|aiff?|flac|m4a|aac|mp4|ogg)$/i;
const relOf=f=>(f.webkitRelativePath||f._rel||f.name);
function addFiles(list,quiet){
  let n=0;
  for(const f of list){if(!AUDIO_RE.test(f.name)||/(^|\/)\._/.test(relOf(f)))continue;
    const k=nfc(f.name).toLowerCase();if(!state.files.has(k))state.files.set(k,[]);
    const arr=state.files.get(k),rp=nfc(relOf(f));
    if(!arr.some(x=>x.rp===rp&&x.f.size===f.size)){arr.push({f,rp});state.byRel.set(rp.toLowerCase(),f);n++}}
  state.fileCount+=n;if(state.source==='xml')matchFiles();
  if(!quiet){renderAll();toast(`${n} Audiodateien verbunden`)}
}
function matchFiles(){
  for(const t of state.tracks.values()){if(state.source==='usb')continue;
    const c=state.files.get(nfc(t.fname).toLowerCase());t.fileAmb=false;

async function analyzeIds(ids,force){
  const q=ids.map(id=>state.tracks.get(id)).filter(t=>t&&(force||!t.analysis));

  if(q.every(t=>!t.file)){toast('Keine Audiodateien verbunden – Musikordner oder USB-Stick verbinden',1);return}

  const worker=async()=>{while(q.length&&!state.cancel){const t=q.shift();t.status='busy';t.error='';t.errCode='';updateRow(t);

    done++;upd();relCache=null;updateRow(t);if(t.id===state.focus)renderDetail();await sleep(0)}};
  await Promise.all([worker(),worker()]);
  state.busy=false;$('#progress').classList.remove('on');for(const t of state.tracks.values())if(t.status==='busy')t.status=t.analysis?'done':'idle';
  renderAll();const ne=Object.values(errs).reduce((a,b)=>a+b,0);

}

const enc16=s=>{const b=new Uint8Array(s.length*2);for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);b[2*i]=c>>8;b[2*i+1]=c&255}return b};

  for(const t of tracks){const L=seratoLoc(t.path),f=[tag('ttyp',(t.fname.split('.').pop()||'').toLowerCase()),tag('pfil',L.rel),tag('tsng',t.title)];
    if(t.artist)f.push(tag('tart',t.artist));if(t.album)f.push(tag('talb',t.album));if(t.genre)f.push(tag('tgen',t.genre));if(t.bpm)f.push(tag('tbpm',t.bpm.toFixed(2)));if(t.key)f.push(tag('tkey',CAM2KEY[t.cam]||t.keyRaw));

    <div class="field"><label>Energie-Skala<small>Fest: gleicher Maßstab für alle Tracks (empfohlen fürs Rating). Relativ: 1–5 gleichmäßig verteilt in der aktuellen Playlist.</small></label><select id="sMode"><option value="abs" ${S.energyMode==='abs'?'selected':''}>Fest</option><option value="rel" ${S.energyMode==='rel'?'selected':''}>Relativ zur Playlist</option></select></div>
    <div class="field"><label>Unsichere Tracks nur nach Bestätigung exportieren<small>Empfohlen. Betrifft Tracks mit Sicherheit „niedrig“.</small></label>${sw('sConf',S.requireConfirm)}</div>
    <div class="field"><label>Vorhandene Hot Cues A/F/G überschreiben<small>Aus: bestehende Cues auf A, F oder G bleiben.</small></label>${sw('sOver',S.overwrite)}</div>
    <div class="field"><label>Energie als Rating (1–5 ★) schreiben</label>${sw('sRate',S.writeRating)}</div>
    <div class="field"><label>Energie, LUFS und Gain in Kommentar<small>Hängt z.B. „[E4 68 | -7.9 LUFS]“ an, dein Kommentar bleibt.</small></label>${sw('sCom',S.writeComment)}</div>
    <div class="field"><label>Maximale Tracklänge<small>Längere Dateien (Mixe) werden übersprungen, damit der Browser nicht abstürzt.</small></label><select id="sMax">${[10,20,30].map(v=>`<option ${S.maxMin===v?'selected':''} value="${v}">${v} Minuten</option>`).join('')}</select></div>
    </div><div class="foot"><button class="btn primary" data-close>Fertig</button></div>`;
  }else if(kind==='xml'){
    const usb=state.source==='usb';
    h=`<h2>rekordbox XML exportieren</h2><p class="sub">Vor dem Download prüft die App jede Cue und die fertige Datei. Fehlerhafte oder unbestätigte Tracks bekommen keine neuen Cues.</p><div class="body">
    <h3>Ziel-Playlist</h3><div class="opts">
      <label><input type="radio" name="xmode" value="new" checked> Als neue Playlist speichern <input class="inp" id="xName" value="${esc((pl?pl.name:'Collection')+' Edited')}" aria-label="Name der neuen Playlist"></label>
      ${pl?`<label><input type="radio" name="xmode" value="over"> Bestehende Playlist „${esc(pl.name)}“ überschreiben<span class="c">ganze Playlist, aktuelle Sortierung</span></label>`:''}</div>
    <div id="xOverNote" class="note warn" hidden>Die Playlist kommt mit gleichem Namen und Ordner in die XML. Beim Import über „Playlist importieren“ ersetzt rekordbox sie. Falls rekordbox eine zweite gleichnamige anlegt, die alte löschen. Vorher Library-Backup machen.</div>
    <div id="xScope"><h3>Umfang</h3><div class="opts"><label><input type="radio" name="xscope" value="all" checked> Ganze Playlist in aktueller Sortierung<span class="c">${listIds().length} Tracks</span></label><label><input type="radio" name="xscope" value="view"> Nur aktuelle Ansicht (Filter/Suche)<span class="c">${state.view.length} Tracks</span></label></div></div>
    ${usb?`<h3>Pfad zum Stick</h3><div class="field"><label>Wo liegt der Stick auf dem Rechner, an dem du importierst?<small>Mac: /Volumes/Name · Windows: z.B. D:</small></label><input class="inp" id="xRoot" value="/Volumes/${esc(state.volName)}"></div>
      <div class="note err"><b>Achtung bei Stick-Quelle:</b> Die XML zeigt auf die Dateien auf dem Stick. Liegen die Tracks in deiner rekordbox-Library woanders (z.B. im Musik-Ordner), legt rekordbox sie beim Import <b>doppelt</b> an. Für deine Haupt-Library besser: Collection als XML exportieren und Weg 1 nutzen.</div>`:''}
    <h3>Vorschau der Änderungen</h3><div id="xDiff"></div>
    </div><div class="foot"><span class="info" id="xInfo"></span><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="xGo" data-act="doXml">Prüfen &amp; herunterladen</button></div>`;
  }else if(kind==='guide'){
    h=`<h2>${ctx?`Export fertig: ${ctx.n} von ${ctx.total} Tracks mit neuen Cues`:'Anleitung'}</h2><p class="sub">${ctx?`Playlist „${esc(ctx.name)}“. So kommt sie in rekordbox:`:'Einmal einrichten, danach dauert der Import 20 Sekunden.'}</p><div class="body">
    <div class="note warn"><b>Vorher:</b> rekordbox → Datei → Library → Library sichern. Der Import ersetzt bei den betroffenen Tracks die Cues durch den Stand aus der XML.</div>
    <ol class="guide"><li>rekordbox → <b>Einstellungen → Ansicht → Layout</b>: „rekordbox xml“ anhaken.</li>
    <li><b>Einstellungen → Erweitert → Datenbank → rekordbox xml</b>: unter „Importierte Library“ die heruntergeladene Datei wählen.</li>
    <li>Links im Baum <b>rekordbox xml</b> aufklappen (ggf. Reload-Pfeil) → ${ctx&&ctx.mode==='over'?'deine Playlist':'<b>JAILR Prep</b>'} → „${esc(ctx?ctx.name:'Playlist')}“.</li>
    <li>In der Playlist <b>alle Tracks markieren</b> (⌘A / Strg+A) → Rechtsklick → <b>In Collection importieren</b> → bestätigen.</li>
    <li>Dann die Playlist selbst per Rechtsklick → <b>Playlist importieren</b>.${ctx&&ctx.mode==='over'?' Falls danach zwei gleichnamige existieren: die alte löschen.':''}</li></ol>
    <div class="note">Schritt 4 mit markierten Tracks ist wichtig – nur so aktualisiert rekordbox bereits vorhandene Tracks zuverlässig.<br>Teste beim ersten Mal mit 2–3 Tracks und prüfe die Cues am Gerät.</div>
    <h3>Wenn etwas nicht klappt</h3><div style="color:var(--fg2);font-size:12px;line-height:1.6">Tracks mit <b>Fehler</b> (keine Datei, nicht lesbar, kein Beatgrid, zu lang) werden nie verändert – Filter „Fehler“ zeigt sie, Export → Problemliste sagt, was zu tun ist. Tracks mit <b>niedriger Sicherheit</b> erst anhören, ggf. Marker verschieben und mit <kbd>C</kbd> bestätigen.</div>
    <h3>Energie (1–5)</h3><div style="color:var(--fg2);font-size:12px;line-height:1.6">Tempo 30 % · Dichte (Percussion pro Beat) 25 % · Drive (Anteil voller Energie) 20 % · Bass/Kick-Druck 15 % · Höhen 10 %. Lautstärke zählt bewusst nicht – die regelst du mit dem Gain. Klick auf die Balken im Detail setzt deinen eigenen Wert.</div>
    <h3>Shortcuts</h3><div style="display:grid;grid-template-columns:auto 1fr;gap:6px 12px;color:var(--fg2);font-size:12px">
    <span><kbd>↑</kbd> <kbd>↓</kbd></span><span>Track wechseln (Shift: Auswahl erweitern)</span><span><kbd>Enter</kbd></span><span>Auswahl bzw. Playlist analysieren</span>
    <span><kbd>Leertaste</kbd></span><span>Abspielen / Stopp</span><span><kbd>A</kbd> <kbd>F</kbd> <kbd>G</kbd> <kbd>L</kbd></span><span>Marker wählen + anhören (L loopt)</span>
    <span><kbd>←</kbd> <kbd>→</kbd></span><span>Gewählten Marker 1 Bar verschieben (Shift: 8 Bars)</span><span><kbd>C</kbd></span><span>Cues bestätigen</span>
    <span><kbd>R</kbd></span><span>Cues auf Automatik</span><span><kbd>⌘Z</kbd> / <kbd>Strg+Z</kbd></span><span>Rückgängig</span><span><kbd>/</kbd></span><span>Suche</span></div>
    </div><div class="foot"><button class="btn primary" data-close>Verstanden</button></div>`;
  }else if(kind==='serato'){
    h=`<h2>Serato Crates exportieren</h2><p class="sub">Wandelt Playlists in Serato-Crates um (ZIP mit _Serato_-Ordner).</p><div class="body">
    <div class="opts plsel">${state.playlists.map((p,i)=>`<label><input type="checkbox" value="${i}" ${i===state.cur?'checked':''}> ${esc([...p.folder,p.name].join(' / '))}<span class="c">${p.ids.length}</span></label>`).join('')}</div>
    <h3>Crate-Name</h3><div class="opts"><label><input type="radio" name="smode" value="over" checked> Gleicher Name – überschreibt gleichnamige Crates</label><label><input type="radio" name="smode" value="new"> Neue Crate mit Zusatz <input class="inp" id="sSuffix" value=" Edited" aria-label="Namenszusatz"></label></div>
    <div class="field"><label>Aktuelle Sortierung übernehmen</label>${sw('srtSort',true)}</div>
    <div class="field"><label>Serato-Datenbank mitschreiben<small>Für einen frischen Stick sinnvoll. Ersetzt eine vorhandene „database V2“.</small></label>${sw('srtDb',true)}</div>
    <div class="note">Wohin der Ordner gehört, steht in der LIESMICH.txt. Hot Cues überträgt dieser Weg nicht.</div>
    </div><div class="foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" data-act="doSerato">ZIP herunterladen</button></div>`;
  }
  m.innerHTML=h;$('#modalBg').classList.add('on');
  if(kind==='settings'){const on=(id,fn)=>$('#'+id).addEventListener('change',e=>{fn(e.target);saveS();relCache=null;renderMain();renderBar();renderDetail()});
    on('sMix',e=>S.mixBars=+e.value);on('sLoop',e=>S.loopBars=+e.value);on('sSens',e=>S.sens=clamp(+e.value||3,1,12));on('sMode',e=>S.energyMode=e.value);on('sConf',e=>S.requireConfirm=e.checked);
    on('sOver',e=>S.overwrite=e.checked);on('sRate',e=>S.writeRating=e.checked);on('sCom',e=>S.writeComment=e.checked);on('sMax',e=>S.maxMin=+e.value)}
  if(kind==='xml'){renderXmlDiff();m.addEventListener('change',e=>{if(e.target.name==='xmode'){$('#xOverNote').hidden=e.target.value!=='over';$('#xScope').hidden=e.target.value==='over'}if(['xmode','xscope'].includes(e.target.name)||e.target.id==='xRoot')renderXmlDiff()});m.addEventListener('input',e=>{if(e.target.id==='xName'){$('input[name=xmode][value=new]').checked=true;$('#xOverNote').hidden=true;$('#xScope').hidden=false}})}
  const f=m.querySelector('input,select,button.primary');if(f)f.focus();
}
function closeModal(){$('#modalBg').classList.remove('on');if(lastFocus&&lastFocus.focus)lastFocus.focus()}

/* ================= events ================= */
async function readXmlFile(f){try{loadXml(await f.text(),f.name)}catch(e){toast(e.message,1)}}
$('#inXml').addEventListener('change',e=>{const f=e.target.files[0];if(f)readXmlFile(f);e.target.value=''});
$('#inDir').addEventListener('change',async e=>{const fs=[...e.target.files];e.target.value='';await handleFiles(fs)});
$('#pillLib').onclick=()=>$('#inXml').click();$('#pillMusic').onclick=()=>$('#inDir').click();
$('#btnSide').onclick=()=>{if(matchMedia('(max-width:900px)').matches)document.body.classList.toggle('showside');else document.body.classList.toggle('noside');setTimeout(()=>{drawTL();renderRows()},50)};
$('#btnSettings').onclick=()=>openModal('settings');$('#btnHelp').onclick=()=>openModal('guide');$('#btnCancel').onclick=()=>{state.cancel=true};
$('#btnAnalyze').onclick=()=>analyzeIds(state.sel.size>1?[...state.sel]:state.view);
$('#btnExport').onclick=e=>{e.stopPropagation();$('#exportMenu').classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))$('#exportMenu').classList.remove('open')});
$('#exportMenu').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#exportMenu').classList.remove('open');if(b.dataset.act==='csv')exportCsv();else openModal(b.dataset.act)};
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg'||e.target.closest('[data-close]'))closeModal();const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='doXml')exportXml();if(a.dataset.act==='doSerato')exportSerato()}});
let rowsRaf=0;$('#main').addEventListener('scroll',()=>{if(!rowsRaf)rowsRaf=requestAnimationFrame(()=>{rowsRaf=0;renderRows()})},{passive:true});
$('#main').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='xml')$('#inXml').click();if(a.dataset.act==='dir')$('#inDir').click();if(a.dataset.act==='help')openModal('guide');return}
  const th=e.target.closest('th[data-sort]');if(th){const k=th.dataset.sort,i=state.sort.findIndex(s=>s.k===k);
    if(e.shiftKey){if(i>=0)state.sort[i].d*=-1;else state.sort.push({k,d:k==='energy'?-1:1})}else{if(i===0&&state.sort.length===1)state.sort[0].d*=-1;else state.sort=[{k,d:1}]}
    state.sort=state.sort.filter((s,j,arr)=>!(s.k==='idx'&&arr.length>1));renderBar();renderMain();return}
  const tr=e.target.closest('tbody tr.r');if(!tr)return;const id=tr.dataset.id;
  if(e.shiftKey&&state.anchor){const i0=state.view.indexOf(state.anchor),i1=state.view.indexOf(id);state.sel=new Set(state.view.slice(Math.min(i0,i1),Math.max(i0,i1)+1))}
  else if(e.metaKey||e.ctrlKey){state.sel.has(id)?state.sel.delete(id):state.sel.add(id);state.anchor=id}else{state.sel=new Set([id]);state.anchor=id}
  if(state.focus!==id){stop();state.focus=id;renderDetail()}updateSel()});
$('#main').addEventListener('dblclick',e=>{const tr=e.target.closest('tbody tr.r');if(!tr)return;const t=state.tracks.get(tr.dataset.id);if(t.analysis)jump('A');else analyzeIds([t.id])});
$('#side').addEventListener('click',e=>{const f=e.target.closest('[data-folder]');if(f){const k=f.dataset.folder;state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k);renderSide();return}
  const p=e.target.closest('[data-pl]');if(!p)return;state.cur=+p.dataset.pl;state.sel.clear();state.focus=null;stop();document.body.classList.remove('showside');$('#main').scrollTop=0;renderAll()});
$('#side').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}});
$('#q').addEventListener('input',e=>{state.q=e.target.value;renderMain()});
$('#filt').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;state.filter=b.dataset.f;renderBar();renderMain()});
$('#sorts').addEventListener('click',e=>{const d=e.target.closest('[data-dir]'),r=e.target.closest('[data-rm]');if(d)state.sort[+d.dataset.dir].d*=-1;else if(r){state.sort.splice(+r.dataset.rm,1);if(!state.sort.length)state.sort=[{k:'idx',d:1}]}else return;renderBar();renderMain()});
$('#sorts').addEventListener('change',e=>{if(e.target.id!=='addSort')return;const v=e.target.value;if(!v)return;
  if(v.startsWith('p:'))state.sort={harm:[{k:'key',d:1},{k:'bpm',d:1},{k:'energy',d:1}],build:[{k:'energy',d:1},{k:'bpm',d:1},{k:'key',d:1}],peak:[{k:'energy',d:-1},{k:'bpm',d:-1}]}[v.slice(2)];
  else{state.sort=state.sort.filter(s=>s.k!=='idx');state.sort.push({k:v,d:v==='energy'?-1:1})}renderBar();renderMain()});
let dragI=null;
$('#sorts').addEventListener('dragstart',e=>{const c=e.target.closest('.chip');if(!c)return;dragI=+c.dataset.i;c.classList.add('drag');e.dataTransfer.effectAllowed='move'});
$('#sorts').addEventListener('dragover',e=>{const c=e.target.closest('.chip');if(c&&dragI!==null){e.preventDefault();$$('.chip').forEach(x=>x.classList.toggle('over',x===c))}});
$('#sorts').addEventListener('drop',e=>{const c=e.target.closest('.chip');if(!c||dragI===null)return;e.preventDefault();e.stopPropagation();const[s]=state.sort.splice(dragI,1);state.sort.splice(+c.dataset.i,0,s);dragI=null;renderBar();renderMain()});
$('#sorts').addEventListener('dragend',()=>{dragI=null;$$('.chip').forEach(x=>x.classList.remove('drag','over'))});
$('#btnPlay').onclick=()=>{if(PB.src)stop();else{const t=state.tracks.get(state.focus);const ct=t?.analysis?cueTimes(t):null;play(ct?ct.A:0)}};
$('#dJumps').onclick=e=>{const b=e.target.closest('[data-jump]');if(b)jump(b.dataset.jump)};
$('#dFacts').onclick=e=>{const b=e.target.closest('[data-e]');if(!b)return;const t=state.tracks.get(state.focus);if(!t)return;const v=+b.dataset.e;setManual(t,{E:v||null});toast(v?`Energie für „${t.title}“ auf ${v}/5 gesetzt`:'Energie wieder automatisch')};
$('#dActs').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const t=state.tracks.get(state.focus);if(!t)return;const a=b.dataset.act;
  if(a==='confirm')setManual(t,{ok:true});if(a==='unconfirm')setManual(t,{ok:null});if(a==='reset')setManual(t,{A:null,F:null,G:null,L:null});if(a==='reanalyze')analyzeIds([t.id],true)};
const cv=$('#tl');
cv.addEventListener('mousedown',e=>{const g=tlGeom();if(!g.a)return;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,ct=cueTimes(g.t);
  const hit=['G','F','A','L'].find(k=>Math.abs(g.x(k==='L'?ct.L0:ct[k])-mx)<7);
  if(hit){TL.drag=hit;TL.sel=hit;snap(g.t);e.preventDefault()}else play(mx>3?barT(g.a,nearestBar(g.a,g.s(mx))):0)});
window.addEventListener('mousemove',e=>{const g=tlGeom();if(!g.a)return;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,tip=$('#tlTip');
  if(TL.drag){const k=TL.drag,nb=g.a.rms.length;const b=clamp(nearestBar(g.a,g.s(mx)),0,k==='L'?nb-S.loopBars:nb);const c=computeCues(g.t);if(c[k]!==b){const p={[k]:b,ok:true};if(k==='G'&&g.t.manual?.F==null)p.F=null;t_set(g.t,p)}
    tip.style.display='block';tip.style.left=(14+g.x(barT(g.a,b))+6)+'px';tip.textContent=`${k} → Bar ${b+1} · ${fmtT(barT(g.a,b))}`;return}
  if(e.target===cv){TL.hover=nearestBar(g.a,g.s(mx));const ct=cueTimes(g.t);cv.style.cursor=['G','F','A','L'].some(k=>Math.abs(g.x(k==='L'?ct.L0:ct[k])-mx)<7)?'ew-resize':'crosshair';
    tip.style.display='block';tip.style.left=(14+mx+10)+'px';tip.textContent=`Bar ${TL.hover+1} · ${fmtT(barT(g.a,TL.hover))}`;drawTL()}
  else if(TL.hover>=0){TL.hover=-1;tip.style.display='none';drawTL()}});
function t_set(t,p){t.manual=Object.assign({},t.manual||{},p);for(const k in t.manual)if(t.manual[k]==null)delete t.manual[k];drawTL()}
window.addEventListener('mouseup',()=>{if(TL.drag){const t=state.tracks.get(state.focus);TL.drag=null;$('#tlTip').style.display='none';IDB.put('manual',mKey(t),t.manual);refreshTrack(t)}});
window.addEventListener('resize',()=>{drawTL();renderRows()});
document.addEventListener('keydown',e=>{
  if($('#modalBg').classList.contains('on')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=$$('#modal input,#modal select,#modal button').filter(x=>!x.disabled&&x.offsetParent);if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}}return}
  if(e.target.matches('input,select,textarea')){if(e.key==='Escape')e.target.blur();return}
  if(!state.source)return;const v=state.view;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'){e.preventDefault();state.sel=new Set(v);updateSel();return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let i=v.indexOf(state.focus);i=e.key==='ArrowDown'?Math.min(v.length-1,i+1):Math.max(0,i-1);if(i<0)i=0;const id=v[i];if(!id)return;
    if(e.shiftKey)state.sel.add(id);else{state.sel=new Set([id]);state.anchor=id}stop();state.focus=id;scrollToId(id);updateSel();renderDetail();return}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){if(!state.focus)return;e.preventDefault();moveMarker(TL.sel,(e.key==='ArrowRight'?1:-1)*(e.shiftKey?8:1));return}
  if(e.key==='Enter'){if(e.target.closest('button'))return;analyzeIds(state.sel.size?[...state.sel]:v);return}
  if(e.key===' '){if(e.target.closest('button'))return;e.preventDefault();$('#btnPlay').click();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toUpperCase();
  if(['A','F','G','L'].includes(k)){jump(k);return}
  if(k==='C'){const t=state.tracks.get(state.focus);if(t&&t.analysis){setManual(t,{ok:true});toast('Bestätigt: '+t.title)}return}
  if(k==='R'){const t=state.tracks.get(state.focus);if(t&&t.manual)setManual(t,{A:null,F:null,G:null,L:null});return}
  if(e.key==='/'){e.preventDefault();$('#q').focus();return}if(e.key==='?'){openModal('guide');return}if(e.key==='Escape'){state.sel.clear();updateSel()}});
let dragDepth=0;
window.addEventListener('dragenter',e=>{if(e.dataTransfer.types.includes('Files')){dragDepth++;$('#drop').classList.add('on')}});
window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#drop').classList.remove('on')});
window.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files'))e.preventDefault()});
window.addEventListener('drop',async e=>{if(!e.dataTransfer.types.includes('Files'))return;e.preventDefault();dragDepth=0;$('#drop').classList.remove('on');await handleFiles(await readDropEntries([...e.dataTransfer.items]))});
window.addEventListener('error',e=>{toast('Unerwarteter Fehler: '+(e.message||'unbekannt')+' – Seite ggf. neu laden. Deine Daten bleiben unverändert.',1)});
window.addEventListener('unhandledrejection',e=>{toast('Unerwarteter Fehler: '+((e.reason&&e.reason.message)||e.reason)+' – Deine Daten bleiben unverändert.',1)});
window.addEventListener('beforeunload',e=>{if(state.busy){e.preventDefault();e.returnValue=''}});
renderAll();
</script>
</body>
</html>
